<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-label="Animated diagram: context resolves &#x27;it&#x27;, the forge asks for the rest">
<title>Animated diagram: context resolves &#x27;it&#x27;, the forge asks for the rest</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#45475a"/></marker>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1100" height="500" rx="16" fill="#1e1e2e"/>
<rect x="0.5" y="0.5" width="1099" height="499" rx="16" fill="none" stroke="#313244"/>
<text x="36" y="46" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#cdd6f4" font-weight="700" text-anchor="start" >Context first, questions second</text>
<text x="36" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#7f849c" font-weight="400" text-anchor="start" >Recent messages resolve what “it” means. Only what nobody said yet becomes a question.</text>
<text x="36" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9399b2" font-weight="700" text-anchor="start" letter-spacing="1.5">RECENT CONVERSATION</text>
<rect x="36" y="124" width="430" height="60" rx="10" fill="#181825" stroke="#45475a"/>
<text x="52" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#cba6f7" font-weight="700" text-anchor="start" >claude</text>
<text x="52" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#cdd6f4" font-weight="400" text-anchor="start" textLength="343.2" lengthAdjust="spacingAndGlyphs">Published the prompt-forge plugin on GitHub.</text>
<rect x="36" y="196" width="430" height="44" rx="10" fill="#181825" stroke="#45475a"/>
<text x="52" y="223" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#7f849c" font-weight="400" text-anchor="start" >you  ·  great, it works</text>
<rect x="158.2" y="155" width="99.6" height="22" rx="5" fill="none" stroke="#f5a6e6" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0875;0.1031;0.8469;0.8625;1"/></rect>
<text x="540" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#89b4fa" font-weight="700" text-anchor="start" letter-spacing="1.5">YOUR NEW PROMPT</text>
<rect x="540" y="124" width="524" height="60" rx="10" fill="#181825" stroke="#89b4fa" stroke-width="1.5"/>
<text x="558" y="160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" fill="#cdd6f4" font-weight="400" text-anchor="start" textLength="261.0" lengthAdjust="spacingAndGlyphs">rename it so it&#x27;s independent</text>
<rect x="618.0" y="143" width="24.0" height="24" rx="5" fill="none" stroke="#f5a6e6" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0375;0.0531;0.8469;0.8625;1"/></rect>
<g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0375;0.0562;0.8438;0.8625;1"/><text x="630.0" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#f5a6e6" font-weight="700" text-anchor="middle" >it = ?</text></g>
<path d="M208.0,154 C208.0,100 630.0,96 630.0,141" fill="none" stroke="#f5a6e6" stroke-width="2" stroke-dasharray="700" stroke-dashoffset="700"><animate attributeName="stroke-dashoffset" dur="16s" repeatCount="indefinite" values="700;700;0;0;700;700" keyTimes="0;0.1;0.1625;0.8625;0.8645;1"/></path>
<g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.175;0.1937;0.8438;0.8625;1"/><text x="1064" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#f5a6e6" font-weight="700" text-anchor="end" >resolved from context: it = the prompt-forge plugin</text></g>
<g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.25;0.2687;0.8438;0.8625;1"/><rect x="36" y="262" width="1028" height="58" rx="10" fill="#181825" stroke="#fab387" stroke-width="1.5"/><text x="56" y="287" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#fab387" font-weight="700" text-anchor="start" >✨ Before I send this, I need a bit more context</text><text x="56" y="308" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#cdd6f4" font-weight="400" text-anchor="start" >1. What should the new name be?</text><text x="1048" y="298" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#7f849c" font-weight="400" text-anchor="end" >the new name was never mentioned</text></g>
<g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3875;0.4062;0.8438;0.8625;1"/><rect x="36" y="334" width="1028" height="40" rx="10" fill="#181825" stroke="#89b4fa" stroke-width="1.5"/><text x="56" y="359" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#89b4fa" font-weight="700" text-anchor="start" >you  ›</text><text x="110" y="359" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#cdd6f4" font-weight="400" text-anchor="start" >prompt-smith</text></g>
<g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.525;0.5438;0.8438;0.8625;1"/><rect x="36" y="392" width="1028" height="64" rx="10" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/><text x="56" y="416" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a6e3a1" font-weight="700" text-anchor="start" letter-spacing="1.5">SENT TO CLAUDE</text><text x="56" y="440" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#cdd6f4" font-weight="400" text-anchor="start" textLength="990" lengthAdjust="spacingAndGlyphs">Rename the prompt-forge plugin to prompt-smith everywhere, so it no longer depends on the other plugin.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.625;0.6438;0.8438;0.8625;1"/><text x="1064" y="482" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#cba6f7" font-weight="700" text-anchor="end" >→ Claude starts working</text></g>
</svg>
