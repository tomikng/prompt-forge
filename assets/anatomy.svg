<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" role="img" aria-label="Animated diagram: anatomy of a Prompt Forge rewrite">
<title>Animated diagram: anatomy of a Prompt Forge rewrite</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#45475a"/></marker>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1100" height="470" rx="16" fill="#1e1e2e"/>
<rect x="0.5" y="0.5" width="1099" height="469" rx="16" fill="none" stroke="#313244"/>
<text x="36" y="46" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#cdd6f4" font-weight="700" text-anchor="start" >Anatomy of a rewrite</text>
<text x="36" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#7f849c" font-weight="400" text-anchor="start" >Every detail you typed is kept word for word; only a missing finish line is added.</text>
<text x="36" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#89b4fa" font-weight="700" text-anchor="start" letter-spacing="1.5">YOU TYPED</text>
<rect x="36" y="130" width="319.2" height="34" rx="8" fill="#181825" stroke="#45475a"/>
<rect x="36" y="130" width="319.2" height="34" rx="8" fill="#f5a6e6" fill-opacity="0.18" stroke="#f5a6e6" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0714;0.0893;0.8821;0.9;1"/></rect>
<text x="48" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#cdd6f4" font-weight="400" text-anchor="start" textLength="295.2" lengthAdjust="spacingAndGlyphs">can u make the dashboard load faster</text>
<rect x="365.2" y="130" width="311.0" height="34" rx="8" fill="#181825" stroke="#45475a"/>
<rect x="365.2" y="130" width="311.0" height="34" rx="8" fill="#f5a6e6" fill-opacity="0.18" stroke="#f5a6e6" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0714;0.0893;0.8821;0.9;1"/></rect>
<text x="377.2" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#cdd6f4" font-weight="400" text-anchor="start" textLength="287.0" lengthAdjust="spacingAndGlyphs">its really slow on the orders page,</text>
<rect x="686.2" y="130" width="171.6" height="34" rx="8" fill="#181825" stroke="#45475a"/>
<rect x="686.2" y="130" width="171.6" height="34" rx="8" fill="#fab387" fill-opacity="0.18" stroke="#fab387" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2571;0.275;0.8821;0.9;1"/></rect>
<text x="698.2" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#cdd6f4" font-weight="400" text-anchor="start" textLength="147.6" lengthAdjust="spacingAndGlyphs">dont touch the api</text>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0714;0.0929;0.8786;0.9;1"/><path d="M550,172 L550,214" stroke="#f5a6e6" stroke-width="2" marker-end="url(#arrow)"/><text x="564" y="199" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#f5a6e6" font-weight="700" text-anchor="start" >✨ Haiku forge</text></g>
<text x="36" y="240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a6e3a1" font-weight="700" text-anchor="start" letter-spacing="1.5">SENT TO CLAUDE</text>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1143;0.1429;0.8714;0.9;1"/><rect x="36" y="262" width="1028" height="40" rx="8" fill="#181825" stroke="#f5a6e6" stroke-width="1.5"/><rect x="36" y="262" width="6" height="40" rx="3" fill="#f5a6e6"/><text x="56" y="287" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#f5a6e6" font-weight="700" text-anchor="start" >Goal</text><text x="170" y="287" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#cdd6f4" font-weight="400" text-anchor="start" >Make the dashboard&#x27;s orders page load faster; it is currently slow.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3;0.3286;0.8714;0.9;1"/><rect x="36" y="314" width="1028" height="40" rx="8" fill="#181825" stroke="#fab387" stroke-width="1.5"/><rect x="36" y="314" width="6" height="40" rx="3" fill="#fab387"/><text x="56" y="339" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#fab387" font-weight="700" text-anchor="start" >Constraints</text><text x="170" y="339" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#cdd6f4" font-weight="400" text-anchor="start" >Do not change the API.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4857;0.5143;0.8714;0.9;1"/><rect x="36" y="366" width="1028" height="40" rx="8" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/><rect x="36" y="366" width="6" height="40" rx="3" fill="#a6e3a1"/><text x="56" y="391" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#a6e3a1" font-weight="700" text-anchor="start" >Done when</text><text x="170" y="391" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#cdd6f4" font-weight="400" text-anchor="start" >The orders page renders noticeably faster, measured before and after.</text><rect x="958" y="375" width="94" height="22" rx="11" fill="#a6e3a1"/><text x="1005" y="390" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#11111b" font-weight="700" text-anchor="middle" >+ added</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6143;0.6357;0.8786;0.9;1"/><rect x="36" y="424" width="200.79999999999998" height="28" rx="14" fill="none" stroke="#a6e3a1" stroke-width="1.5"/><text x="136.39999999999998" y="443" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#a6e3a1" font-weight="600" text-anchor="middle" >+ stated the goal first</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.65;0.6714;0.8786;0.9;1"/><rect x="246.79999999999998" y="424" width="185.6" height="28" rx="14" fill="none" stroke="#a6e3a1" stroke-width="1.5"/><text x="339.59999999999997" y="443" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#a6e3a1" font-weight="600" text-anchor="middle" >+ kept your API limit</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6857;0.7071;0.8786;0.9;1"/><rect x="442.4" y="424" width="178.0" height="28" rx="14" fill="none" stroke="#a6e3a1" stroke-width="1.5"/><text x="531.4" y="443" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#a6e3a1" font-weight="600" text-anchor="middle" >+ added a done check</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7214;0.7429;0.8786;0.9;1"/><rect x="630.4" y="424" width="124.8" height="28" rx="14" fill="none" stroke="#a6e3a1" stroke-width="1.5"/><text x="692.8" y="443" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#a6e3a1" font-weight="600" text-anchor="middle" >+ fixed typos</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6;0.6214;0.8786;0.9;1"/><text x="1064" y="443" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#7f849c" font-weight="400" text-anchor="end" >shown on the card</text></g>
</svg>
